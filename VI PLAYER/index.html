<!DOCTYPE html>
<html lang="en" data-board="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header>
    <div>
      <h1><span class="glyph">&#9822;</span> Chess</h1>
      <p>Play the computer, or pass &amp; play with a friend.</p>
    </div>
    <div class="header-actions">
      <select id="themeSel" title="Board theme">
        <option value="green">Green</option>
        <option value="wood">Wood</option>
        <option value="blue">Blue</option>
        <option value="slate">Slate</option>
      </select>
      <button id="flipBtn" class="btn" title="Flip board">&#8645; Flip</button>
    </div>
  </header>

  <main class="layout">

    <section class="board-area">
      <div class="player" id="playerTop">
        <div class="player-avatar" id="avatarTop">&#9823;</div>
        <div class="player-info">
          <div class="player-name" id="nameTop">Black</div>
          <div class="captured" id="capturedTop"></div>
        </div>
        <div class="player-score" id="scoreTop"></div>
      </div>

      <div class="board-shell">
        <div class="board" id="board"></div>
        <div class="thinking" id="thinking" hidden><i></i><i></i><i></i></div>
      </div>

      <div class="player" id="playerBottom">
        <div class="player-avatar" id="avatarBottom">&#9819;</div>
        <div class="player-info">
          <div class="player-name" id="nameBottom">White</div>
          <div class="captured" id="capturedBottom"></div>
        </div>
        <div class="player-score" id="scoreBottom"></div>
      </div>
    </section>

    <aside class="panel">

      <div class="status" id="status">White to move</div>

      <div class="group">
        <div class="group-title">Game</div>
        <div class="row">
          <label>Opponent</label>
          <select id="modeSel">
            <option value="ai">Computer</option>
            <option value="human">Two players</option>
          </select>
        </div>
        <div class="row">
          <label>Play as</label>
          <select id="sideSel">
            <option value="w">White</option>
            <option value="b">Black</option>
          </select>
        </div>
        <div class="row">
          <label>Level</label>
          <select id="levelSel">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <button id="newBtn" class="btn btn-primary">New game</button>
      </div>

      <div class="group grow">
        <div class="group-title">Moves</div>
        <div class="moves" id="moves"></div>
        <div class="nav">
          <button class="btn btn-icon" id="firstBtn" title="Go to start">&#8676;</button>
          <button class="btn btn-icon" id="prevBtn" title="Previous move">&#9664;</button>
          <button class="btn btn-icon" id="nextBtn" title="Next move">&#9654;</button>
          <button class="btn btn-icon" id="lastBtn" title="Go to latest">&#8677;</button>
        </div>
        <div class="row2">
          <button id="undoBtn" class="btn">&#8630; Undo</button>
          <button id="copyBtn" class="btn">Copy FEN</button>
        </div>
      </div>

    </aside>
  </main>

  <footer class="hintbar">
    Drag a piece or tap it, then tap the square you want.
    <span class="kbd">&#8592;</span><span class="kbd">&#8594;</span> browse &middot;
    <span class="kbd">U</span> undo &middot;
    <span class="kbd">N</span> new game
  </footer>

</div>

<div class="modal" id="promoModal" hidden>
  <div class="modal-box">
    <div class="modal-title">Promote to</div>
    <div class="promo-options" id="promoOptions"></div>
  </div>
</div>

<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
